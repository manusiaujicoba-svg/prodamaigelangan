<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Prodamai Gelangan</title>

<style>
  :root{
    --card-bg: rgba(255,255,255,0.95);
    --primary: #2a5298;
    --primary-dark: #1e3c72;
    --text: #1f2937;
    --radius: 16px;
    --btn-height: 56px;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    min-height:100vh;
    min-height:100dvh;
    font-family: 'Arial Narrow', Arial, sans-serif;
    background: linear-gradient(135deg,#1e3c72,#2a5298);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 20px 16px;
    color: var(--text);
  }

  .container{ width:100%; max-width:480px; text-align:center; }
  .screen{ display:none; animation: fadeIn .35s ease; }
  .screen.active{ display:block; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

  .logo-circle{
    width: clamp(72px, 22vw, 96px);
    height: clamp(72px, 22vw, 96px);
    border-radius:50%;
    background: rgba(255,255,255,0.15);
    border:3px solid rgba(255,255,255,0.6);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 16px auto;
    font-size: clamp(30px, 8vw, 40px);
    overflow:hidden;
  }

  h1{
    color:#fff;
    font-size: clamp(1.25rem, 5vw, 1.6rem);
    margin-bottom:6px;
    text-shadow:0 2px 8px rgba(0,0,0,0.25);
    line-height:1.25;
  }
  .subtitle{
    color:rgba(255,255,255,0.85);
    margin-bottom:24px;
    font-size: clamp(0.85rem, 3.2vw, 0.95rem);
  }

  .btn-box{
    background: linear-gradient(135deg, rgba(0,0,0,0.22), rgba(0,0,0,0.08));
    border: 1px solid rgba(255,255,255,0.20);
    border-radius: 24px;
    padding: clamp(20px, 6vw, 28px) clamp(16px, 5vw, 22px) 20px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .btn-box .logo-circle{ margin-top:0; }
  .btn-box .subtitle{ margin-bottom:20px; }
  .btn-box .year-label{ margin-bottom:0; }
  .btn-box #linkList{ margin-top:16px; }

  .btn{
    display:flex; align-items:center; justify-content:center;
    width:100%; min-height: var(--btn-height);
    padding: 12px 18px; margin: 10px 0;
    border:none; border-radius: var(--radius);
    background: var(--card-bg); color: var(--primary-dark);
    font-size: clamp(0.92rem, 3.6vw, 1.05rem);
    font-weight:600; cursor:pointer;
    box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    transition: transform .15s ease, box-shadow .15s ease;
    text-decoration:none;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover{ transform: translateY(-3px); box-shadow:0 10px 24px rgba(0,0,0,0.22); }
  .btn:active{ transform: translateY(0) scale(0.98); }
  .btn:first-child{ margin-top:0; }
  .btn:last-child{ margin-bottom:0; }

  .btn-year{ display:inline-flex; width:47%; margin:6px 1.5%; }
  .year-row{ display:flex; flex-wrap:wrap; justify-content:center; }
  .year-row .btn:first-child{ margin-top:6px; }
  .year-row .btn:last-child{ margin-bottom:6px; }

  .btn-back{
    margin-top:18px;
    background: rgba(255,255,255,0.15);
    color:#fff;
    border:1px solid rgba(255,255,255,0.5);
    box-shadow:none;
    font-weight:500;
  }
  .btn-back:hover{ background: rgba(255,255,255,0.25); }

  .year-label{
    display:inline-block; color:#fff; font-weight:700; margin-bottom:18px;
    font-size: clamp(0.95rem, 3.8vw, 1.1rem);
    background: rgba(0,0,0,0.2); padding:6px 16px; border-radius:999px;
  }

  @media (max-width: 360px){
    body{ padding: 14px 10px; }
    .btn-box{ padding: 18px 14px 16px; }
    .btn{ font-size:0.9rem; padding:10px 14px; }
  }
</style>
</head>
<body id="body">

  <div class="container">

    <div class="screen active" id="screen-home">
      <div class="btn-box">
        <div class="logo-circle" id="homeLogo">
          <span id="homeLogoEmoji">&#127968;</span>
          <img id="homeLogoImg" style="display:none; width:100%; height:100%; object-fit:cover; border-radius:50%;" alt="Logo Kelurahan">
        </div>
        <h1 id="namaKelurahan">Memuat...</h1>
        <p class="subtitle" id="subtitleText"></p>
        <button class="btn" onclick="goTo('screen-year')">Masuk</button>
      </div>
    </div>

    <div class="screen" id="screen-year">
      <div class="btn-box">
        <div class="logo-circle">&#128197;</div>
        <h1>Pilih Tahun</h1>
        <p class="subtitle">Silakan pilih data tahun yang ingin dilihat</p>
        <div class="year-row" id="yearButtons"></div>
        <button class="btn btn-back" onclick="goTo('screen-home')">Kembali</button>
      </div>
    </div>

    <div class="screen" id="screen-links">
      <div class="btn-box">
        <span class="year-label" id="yearLabel">Tahun</span>
        <div id="linkList"></div>
        <button class="btn btn-back" onclick="goTo('screen-year')">Kembali</button>
      </div>
    </div>

  </div>

<script>
const SITE_DATA = {

  namaKelurahan: "Kelurahan Gelangan",

  subtitle: "Progres Prodamai Kelurahan",

  logoUrl: "",
  background: { type: "image", value: "kotamagelang.jpg" },

  tahun: {
    "2026": [
      { label: "Profil Kelurahan", url: "https://gelangan.magelangkota.go.id" },
      { label: "Uji Coba", url: "https://gelangan.magelangkota.go.id" }
    ],
    "2027": [
      { label: "Profil Kelurahan", url: "https://gelangan.magelangkota.go.id" },
      { label: "Diisi opo meneh", url: "https://gelangan.magelangkota.go.id" }
    ]
  }
};

const bodyEl = document.getElementById('body');

function goTo(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function applyBackgroundValue(bg){
  if(!bg) return;
  if(bg.type === "image"){
    bodyEl.style.background = `url("${bg.value}") center/cover no-repeat fixed`;
  } else {
    bodyEl.style.background = bg.value;
  }
}

function renderYearButtons(){
  const wrap = document.getElementById('yearButtons');
  wrap.innerHTML = "";
  Object.keys(SITE_DATA.tahun).forEach(year => {
    const btn = document.createElement('button');
    btn.className = "btn btn-year";
    btn.textContent = year;
    btn.onclick = () => openYear(year);
    wrap.appendChild(btn);
  });
}

function openYear(year){
  document.getElementById('yearLabel').textContent = "Tahun " + year;
  const list = document.getElementById('linkList');
  list.innerHTML = "";
  const items = SITE_DATA.tahun[year] || [];
  if(items.length === 0){
    list.innerHTML = '<p style="color:#374151;">Belum ada data untuk tahun ini.</p>';
  } else {
    items.forEach(item => {
      const a = document.createElement('a');
      a.href = item.url; a.target = "_blank"; a.rel = "noopener"; a.className = "btn";
      a.textContent = item.label;
      list.appendChild(a);
    });
  }
  goTo('screen-links');
}

function renderSite(){
  document.getElementById('namaKelurahan').textContent = SITE_DATA.namaKelurahan || "Kelurahan";
  document.getElementById('subtitleText').textContent = SITE_DATA.subtitle || "";
  applyBackgroundValue(SITE_DATA.background);
  document.title = SITE_DATA.namaKelurahan || "Microsite Kelurahan";

  const emojiEl = document.getElementById('homeLogoEmoji');
  const imgEl = document.getElementById('homeLogoImg');
  if(SITE_DATA.logoUrl){
    imgEl.src = SITE_DATA.logoUrl;
    imgEl.style.display = "block";
    emojiEl.style.display = "none";
  } else {
    imgEl.style.display = "none";
    emojiEl.style.display = "inline";
  }

  renderYearButtons();
}

renderSite();
</script>
</body>
</html>
